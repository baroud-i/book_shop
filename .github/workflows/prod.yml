name: Prod — Promotion-Only Pipeline

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ── STEP 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── STEP 2: Read the version from repo variable ────────────────────────
      - name: Read production version
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_VERSION }}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Deploying version: ${{ vars.IMAGE_VERSION }}"
          echo "Full image: ${IMAGE_TAG}"

      # ── STEP 3: Log in to Docker Hub ──────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── STEP 4: Verify the image exists ───────────────────────────────────
      - name: Verify image exists in registry
        run: |
          docker manifest inspect "${{ env.IMAGE_TAG }}" \
            && echo "Image exists — safe to deploy" \
            || (echo "ERROR: Image ${{ env.IMAGE_TAG }} not found in registry" && exit 1)

      # ── STEP 5: Deploy to EC2 ────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull "${{ env.IMAGE_TAG }}"

            mkdir -p ~/deployments/prod
            cd ~/deployments/prod

            cat > .env << 'EOF'
            IMAGE=${{ env.IMAGE_TAG }}
            HOST_PORT=80
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            EOF

            docker compose -p prod down --remove-orphans
            docker compose -p prod up -d

            docker compose -p prod ps

            echo "Prod deployment complete — visit http://${{ vars.EC2_HOST }}"

      # ── STEP 6: Confirm deployment ────────────────────────────────────────
      - name: Print deployment summary
        run: |
          echo "════════════════════════════════════"
          echo "PROD DEPLOYMENT SUCCESSFUL"
          echo "Version: ${{ vars.IMAGE_VERSION }}"
          echo "Image:   ${{ env.IMAGE_TAG }}"
          echo "URL:     http://${{ vars.EC2_HOST }}"
          echo "════════════════════════════════════"
