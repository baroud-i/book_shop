name: Test — Image-First Pipeline

on:
  push:
    branches: [ test ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: book-shop

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        env:
          SECRET_KEY: dummy-secret-key-for-ci-only
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: book_shop.settings
        run: |
          python manage.py collectstatic --noinput

      # Build a FRESH artifact — intentionally does NOT use the artifacts/ folder
      # that dev committed. This proves the build is reproducible from source.
      - name: Build fresh artifact
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          ARTIFACT_NAME="app-test-${SHORT_SHA}.tar.gz"

          tar -czf "/tmp/${ARTIFACT_NAME}" \
            --exclude='.git' \
            --exclude='../artifacts' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            .

          # Copy to current dir so docker build context can reach it
          cp "/tmp/${ARTIFACT_NAME}" "./${ARTIFACT_NAME}"

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          ls -lh "${ARTIFACT_NAME}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from fresh artifact
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:test-${{ env.SHORT_SHA }}"

          docker build \
            --build-arg ARTIFACT="${{ env.ARTIFACT_NAME }}" \
            -t "${IMAGE_TAG}" \
            .

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Push image to Docker Hub
        run: |
          docker push "${{ env.IMAGE_TAG }}"
          echo "Pushed: ${{ env.IMAGE_TAG }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull "${{ env.IMAGE_TAG }}"

            mkdir -p ~/deployments/test
            cd ~/deployments/test

            cat > .env << EOF
            IMAGE=${{ env.IMAGE_TAG }}
            HOST_PORT=8081
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            EOF

            docker compose -p test down --remove-orphans
            docker compose -p test up -d

            echo "Test deployment done — http://${{ vars.EC2_HOST }}:8081"
