name: Dev — Artifact-First Pipeline

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ── STEP 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── STEP 2: Set up Python ────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── STEP 3: Install dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── STEP 4: Collect static files ──────────────────────────────────────
     - name: Collect static files
        env:
          SECRET_KEY: dummy-secret-key-for-ci-only
          DEBUG: "True"
          DATABASE_URL: sqlite:///tmp/ci.db
        run: |
          python manage.py collectstatic --noinput

      # ── STEP 5: Build the artifact ────────────────────────────────────────
      - name: Build artifact
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          ARTIFACT_NAME="app-${SHORT_SHA}.tar.gz"

          mkdir -p artifacts

          tar -czf "artifacts/${ARTIFACT_NAME}" \
            --exclude='.git' \
            --exclude='artifacts' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            .

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Built artifact: artifacts/${ARTIFACT_NAME}"
          ls -lh "artifacts/${ARTIFACT_NAME}"

      # ── STEP 6: Commit artifact back to the repo ──────────────────────────
      - name: Commit artifact to repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add "artifacts/${{ env.ARTIFACT_NAME }}"

          if git diff --staged --quiet; then
            echo "Nothing to commit — artifact already exists"
          else
            git commit -m "ci: add artifact ${{ env.ARTIFACT_NAME }} [skip ci]"
            git push origin dev
          fi

      # ── STEP 7: Log in to Docker Hub ──────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── STEP 8: Build Docker image FROM the artifact ──────────────────────
      - name: Build Docker image from artifact
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:dev-${{ env.SHORT_SHA }}"

          docker build \
            --build-arg ARTIFACT="artifacts/${{ env.ARTIFACT_NAME }}" \
            -t "${IMAGE_TAG}" \
            .

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Built image: ${IMAGE_TAG}"

      # ── STEP 9: Push image to Docker Hub ──────────────────────────────────
      - name: Push image to Docker Hub
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      # ── STEP 10: Deploy to EC2 ────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull "${{ env.IMAGE_TAG }}"

            mkdir -p ~/deployments/dev
            cd ~/deployments/dev

            cat > .env << 'EOF'
            IMAGE=${{ env.IMAGE_TAG }}
            HOST_PORT=8080
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            EOF

            docker compose -p dev down --remove-orphans
            docker compose -p dev up -d

            echo "Dev deployment complete — visit http://${{ vars.EC2_HOST }}:8080"
