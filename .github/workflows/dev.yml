name: Dev — Artifact-First Pipeline

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Debug step — prints the folder structure so you can see exactly where things are
      - name: Show repo structure
        run: |
          echo "=== Root of repo ==="
          ls -la
          echo "=== Looking for manage.py ==="
          find . -name "manage.py" 2>/dev/null
          echo "=== Looking for requirements.txt ==="
          find . -name "requirements.txt" 2>/dev/null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static files
        env:
          SECRET_KEY: dummy-secret-key-for-ci-only
          DEBUG: "True"
          DJANGO_SETTINGS_MODULE: book_shop.settings
        run: |
          python manage.py collectstatic --noinput

      - name: Build artifact
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          ARTIFACT_NAME="app-${SHORT_SHA}.tar.gz"

          mkdir -p artifacts

          tar -czf "artifacts/${ARTIFACT_NAME}" \
            --exclude='.git' \
            --exclude='artifacts' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.env' \
            --exclude='db.sqlite3' \
            .

          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "Built artifact: artifacts/${ARTIFACT_NAME}"
          ls -lh "artifacts/${ARTIFACT_NAME}"

      - name: Commit artifact to repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add "artifacts/${{ env.ARTIFACT_NAME }}"
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "ci: add artifact ${{ env.ARTIFACT_NAME }} [skip ci]"
            git push origin dev
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from artifact
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME }}:dev-${{ env.SHORT_SHA }}"

          docker build \
            --build-arg ARTIFACT="artifacts/${{ env.ARTIFACT_NAME }}" \
            -t "${IMAGE_TAG}" \
            .

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Push image to Docker Hub
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull "${{ env.IMAGE_TAG }}"

            mkdir -p ~/deployments/dev
            cd ~/deployments/dev

            cat > .env << EOF
            IMAGE=${{ env.IMAGE_TAG }}
            HOST_PORT=8080
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            ALLOWED_HOSTS=${{ vars.EC2_HOST }},localhost
            EOF

            docker compose -p dev down --remove-orphans
            docker compose -p dev up -d

            echo "Dev deployment done — http://${{ vars.EC2_HOST }}:8080"
